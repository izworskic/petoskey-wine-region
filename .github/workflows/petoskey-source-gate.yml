name: Petoskey Wine source gate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the owner gate
        run: npm run check
      - name: Build the hub static export
        run: npm run export:hub
      - name: Upload exact hub export
        uses: actions/upload-artifact@v4
        with:
          name: petoskey-wine-hub-export
          path: out/
          if-no-files-found: error
          retention-days: 14
